name: Computational and desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux graphical dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Core and localization
        run: python -m unittest discover -s tests -v
      - name: Linux native GUI in both languages
        if: runner.os == 'Linux'
        run: xvfb-run -a python verificar_interface.py
      - name: Windows native GUI in both languages
        if: runner.os == 'Windows'
        run: python verificar_interface.py
  independent-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation-only dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Independent reference comparisons
        run: python scripts/validate_independent.py --output local-results/independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: local-results/independent.json
          if-no-files-found: warn
