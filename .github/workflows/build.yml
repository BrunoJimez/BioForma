name: Build portable native applications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core checks before packaging
        run: python -m unittest discover -s tests -v
      - name: Install build-only dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build for this OS
        run: python build_executable.py
      - uses: actions/upload-artifact@v4
        with:
          name: BioForma-${{ runner.os }}-0.3.0
          path: |
            dist/BioFormaStudio-*.zip
            dist/BioFormaStudio-*.tar.gz
          if-no-files-found: error
